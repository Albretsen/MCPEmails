name: Deploy edge function

# Run by hand (Actions tab -> "Deploy edge function" -> Run workflow) to deploy
# one edge function from main. Uses the SUPABASE_ACCESS_TOKEN repository secret,
# so a deploy can be started from a phone, or from a cloud session whose network
# policy does not reach api.supabase.com.
#
# Deploys from main only: concurrent sessions share this repository, and
# deploying from a stale branch silently reverts other people's live work.

on:
  workflow_dispatch:
    inputs:
      function:
        description: Edge function to deploy
        required: true
        default: mcp-server
        type: choice
        options:
          - mcp-server
          - client-api

concurrency:
  group: deploy-${{ inputs.function }}
  cancel-in-progress: false

permissions:
  contents: read
  # Read the "CI passed" check run on the commit before deploying it.
  checks: read

jobs:
  deploy:
    name: Deploy ${{ inputs.function }}
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      # 2026-10-15: nothing used to check CI before an edge deploy, so a red
      # main could go live here while Vercel held the web deploy back. Require
      # the same "CI passed" aggregate Vercel gates on, for this exact commit.
      # No bypass input on purpose: the emergency path is a local CLI deploy
      # (supabase functions deploy ... --project-ref ... --no-verify-jwt).
      - name: Require CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Latest run wins, so a green rerun clears an earlier failure.
          state=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs?check_name=CI%20passed&per_page=100" \
            --jq '[.check_runs[] | select(.name == "CI passed")]
                  | sort_by(.started_at) | last
                  | if . == null then "missing"
                    elif .status != "completed" then .status
                    else .conclusion end')
          echo "CI passed on ${{ github.sha }}: $state"
          case "$state" in
            success) ;;
            missing|queued|in_progress|pending|waiting|requested)
              echo "::error::CI has not finished on ${{ github.sha }} ($state). Wait for the CI workflow to go green, then rerun this deploy."
              exit 1 ;;
            *)
              echo "::error::CI did not pass on ${{ github.sha }} ($state). Fix main before deploying."
              exit 1 ;;
          esac
      - uses: actions/checkout@v7
      # Pinned to match the db job in ci.yml. Bump both together.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.118.0
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy "${{ inputs.function }}" \
            --project-ref swvaxorwumispmjaaszb \
            --no-verify-jwt \
            --use-api
