name: Deploy to Production

on:
  push:
    branches: [main]

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  migrate:
    name: Apply Database Migrations + Verify RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      - name: Link to production project
        run: |
          supabase link \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --password "$SUPABASE_DB_PASSWORD"
      - name: Apply pending migrations to production
        run: |
          supabase db push --linked --password "$SUPABASE_DB_PASSWORD"
      - name: Verify all public tables have RLS enabled in production
        env:
          # Direct database connection. Host is deterministic from the project
          # ref (db.<ref>.supabase.co); no region guessing required. If the
          # runner can't reach the direct host over IPv6, set SUPABASE_DB_URL
          # (a session-pooler connection string) as a secret and it is used
          # instead.
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            CONN="$SUPABASE_DB_URL"
          else
            CONN="host=db.${SUPABASE_PROJECT_ID}.supabase.co port=5432 dbname=postgres user=postgres sslmode=require"
          fi
          UNPROTECTED=$(psql "$CONN" \
            --no-align --tuples-only --quiet \
            -c "SELECT c.relname
                FROM pg_class c
                JOIN pg_namespace n ON n.oid = c.relnamespace
                WHERE n.nspname = 'public'
                  AND c.relkind IN ('r','p')
                  AND c.relrowsecurity = false")
          if [ -n "$UNPROTECTED" ]; then
            echo "CRITICAL: Production tables are missing RLS:"
            echo "$UNPROTECTED"
            exit 1
          fi
          echo "Production RLS check passed — all public tables are protected."

  deploy-edge-functions:
    name: Deploy Supabase Edge Functions
    runs-on: ubuntu-latest
    needs: [migrate]
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      - name: Deploy mcp-server Edge Function
        run: |
          supabase functions deploy mcp-server \
            --project-ref $SUPABASE_PROJECT_ID \
            --no-verify-jwt
      - name: Deploy token-refresh Edge Function
        run: |
          supabase functions deploy token-refresh \
            --project-ref $SUPABASE_PROJECT_ID
      - name: Deploy partition-manager Edge Function
        run: |
          supabase functions deploy partition-manager \
            --project-ref $SUPABASE_PROJECT_ID

  deploy-vercel:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    needs: [migrate, deploy-edge-functions]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install -g vercel@latest
      - name: Pull Vercel environment variables
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN
      - name: Build for production
        run: vercel build --prod --token=$VERCEL_TOKEN
      - name: Deploy to production
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to $URL"
