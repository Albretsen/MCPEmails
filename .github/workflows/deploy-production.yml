name: Deploy to Production

on:
  push:
    branches: [main]

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  migrate:
    name: Apply Database Migrations + Verify RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply pending migrations to production
        run: |
          supabase db push \
            --project-ref $SUPABASE_PROJECT_ID \
            --password $SUPABASE_DB_PASSWORD
      - name: Verify all public tables have RLS enabled in production
        run: |
          UNPROTECTED=$(supabase db query \
            --project-ref $SUPABASE_PROJECT_ID \
            --password $SUPABASE_DB_PASSWORD \
            "SELECT c.relname
             FROM pg_class c
             JOIN pg_namespace n ON n.oid = c.relnamespace
             WHERE n.nspname = 'public'
               AND c.relkind IN ('r','p')
               AND c.relrowsecurity = false" \
            --csv 2>/dev/null | tail -n +2)
          if [ -n "$UNPROTECTED" ]; then
            echo "CRITICAL: Production tables are missing RLS:"
            echo "$UNPROTECTED"
            exit 1
          fi
          echo "Production RLS check passed — all public tables are protected."

  deploy-edge-functions:
    name: Deploy Supabase Edge Functions
    runs-on: ubuntu-latest
    needs: [migrate]
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy mcp-server Edge Function
        run: |
          supabase functions deploy mcp-server \
            --project-ref $SUPABASE_PROJECT_ID \
            --no-verify-jwt
      - name: Deploy token-refresh Edge Function
        run: |
          supabase functions deploy token-refresh \
            --project-ref $SUPABASE_PROJECT_ID
      - name: Deploy partition-manager Edge Function
        run: |
          supabase functions deploy partition-manager \
            --project-ref $SUPABASE_PROJECT_ID

  deploy-vercel:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    needs: [migrate, deploy-edge-functions]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install -g vercel@latest
      - name: Pull Vercel environment variables
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN
      - name: Build for production
        run: vercel build --prod --token=$VERCEL_TOKEN
      - name: Deploy to production
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to $URL"
