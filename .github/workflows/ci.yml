name: CI

on:
  pull_request:
    branches: [main]
  # WHY A PUSH TRIGGER (2026-09-17). With `pull_request` alone this pipeline
  # had never run for any change that reached production, because nothing here
  # goes through a PR: work is integrated locally and pushed straight to main.
  # Checked on 2026-09-17, a day with eleven commits on main: CI ran zero
  # times, including for the run that added the `card` job itself. Every claim
  # of "green" on those changes came from a local run, which is exactly the
  # verification a pipeline exists to stop depending on.
  #
  # Scoped to `main` on purpose. Branch pushes stay untriggered so a PR gets
  # one run rather than two, and so the dozens of `claude/*` and `ws*` working
  # branches in this repo do not each start a build. The `concurrency` group
  # below keys on `github.ref`, and a push to main (`refs/heads/main`) and a
  # PR (`refs/pull/N/merge`) are different refs, so neither cancels the other.
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# NOTE: The Lint and "Migration Dry-Run + RLS Tests" jobs were removed (2026-06-23)
# because they could never pass in CI and only produced red noise on every PR:
#   - Lint ran `next lint`, which Next.js 16 removed; the flat eslint config
#     (eslint.config.mjs) also needs repair before `eslint .` runs cleanly.
#   - Migration-check needs a local Supabase stack with pg_cron enabled; it
#     failed with `schema "cron" does not exist`.
# The migration half is BACK as the `db` job (2026-09-26): the current CLI's
# Postgres image ships pg_cron, all migrations apply cleanly, and the RLS suite
# was repaired. Lint is still out.
#
# NOTE (2026-08-30): the Dependency Audit job below was added as finding F-05 of
# the Google ADA-CASA pre-submission audit. The gap it closes: with no audit
# step, `npm audit` had drifted to 8 high and 1 moderate advisory, every one of
# them with a published fix, and nothing in this pipeline would ever have said
# so. CASA is an ANNUAL reassessment, so a one-off cleanup would simply have
# drifted back before the next one; the job is here to make the drift visible
# the week it starts. SAST lives in its own workflow (codeql.yml) because it
# runs on a schedule as well as on pull requests.

jobs:
  # Fails the build on any high or critical advisory in the dependency tree.
  #
  # WHY THE REPO ROOT AND NOT `cd apps/web`. apps/web is an npm workspace
  # (see the root package.json "workspaces": ["apps/*"]) and has no lockfile of
  # its own — the root package-lock.json is the single resolved tree for the
  # whole monorepo. Verified 2026-08-30 that both report the identical nine
  # advisories. Running it here is also the only reliable option: `npm audit`
  # inside apps/web works locally only because a previous install happened to
  # leave an apps/web/node_modules behind, which a fresh CI checkout does not
  # have.
  #
  # ONE LOCKFILE (2026-09-26). Until this date production did NOT install from
  # it: apps/web/pnpm-lock.yaml sat in the Vercel Root Directory, so every prod
  # build ran pnpm against a second resolved tree that this audit, CI and
  # dependabot never saw. That file is deleted. Vercel now falls back to npm and
  # installs from this root package-lock.json, proven on a CLI preview before
  # the change landed ("Package Manager changed from pnpm to npm", and
  # @parcel/watcher came out at the locked 2.5.6, not the 2.6.0 a fresh resolve
  # picks). So this audit now describes the tree production ships. Do not
  # re-add a pnpm lockfile anywhere under apps/.
  #
  # WHY NO `npm install`. `npm audit` resolves the tree from package-lock.json
  # and asks the registry about it, so it needs no node_modules at all. That
  # makes this the fastest job in the pipeline and keeps a red audit from being
  # confused with a broken install.
  #
  # WHY NOT `--omit=dev`. The tempting argument is that only shipped code is
  # attackable, so dev dependencies are noise. That is wrong here for two
  # reasons. First, a compromised build-time dependency runs inside this
  # workflow and on the maintainer's laptop, with reach into the same
  # deployment credentials as the production code — the dev/prod split is a
  # split in what the package does, not in what it can touch. Second, and
  # concretely: as of 2026-08-30 `--omit=dev` hides exactly one of the nine
  # current advisories (brace-expansion, high), so adopting it would have
  # started this job's life by quietly suppressing a finding it exists to
  # report. Audit everything the lockfile installs.
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: npm audit (fails on high or critical)
        run: npm audit --audit-level=high

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - name: Run TypeScript type check
        run: cd apps/web && npx tsc --noEmit

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Every test:* script runs TypeScript sources through
          # `node --test --experimental-strip-types`, which does not exist on 20.
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - name: Run unit tests
        run: cd apps/web && npm test

  # The draft editor card (apps/mcp-app) had NO job here at all — not a type
  # check, not its suite — so everything that protects it ran on one laptop and
  # nowhere else. That is the card the user types an unsent email into: its
  # tests are what stand between a refactor and a draft being rewritten on save.
  #
  # WHAT RUNS. `npm test` is `npm run verify`, which is harness/verify.mjs, and
  # that runs FIVE independent suites and reports all of them: the scripted host
  # (state-machine.mjs), hardening (hardening.mjs), the storage audit
  # (storage-audit.mjs), the body/signature suite (draft-body.test.mjs) and the
  # resync suite (draft-sync.test.mjs, 36 checks). Every suite bundles `src/`
  # with esbuild and drives the SHIPPED functions, so a green run here means the
  # code that goes into the card is the code that passed. The first four need no
  # browser at all; the fifth mounts the real editor in jsdom, because the defect
  # it pins — a teardown landing between a new envelope and the effect that would
  # disarm the saver — only exists in a mounted component. Runtime is a couple of
  # seconds.
  #
  # The suite count is load-bearing: verify.mjs prints "N/N suites passed", and
  # it exists because the old `&&` chain let one crashing suite hide the findings
  # of every suite behind it. If that line ever says fewer than five, a suite was
  # dropped rather than fixed.
  #
  # WHY `npm ci` AT THE ROOT. apps/mcp-app is an npm workspace (root
  # package.json "workspaces": ["apps/*"]) with no lockfile of its own, exactly
  # like apps/web. The root install is what puts vite, typescript and the
  # harness's two non-builtin imports in the root node_modules that apps/mcp-app
  # resolves up into. Neither is declared here: esbuild arrives as vite's own
  # dependency, jsdom as a direct dependency of the apps/web workspace. Both are
  # single hoisted copies, but if this job ever fails on `Cannot find package
  # 'esbuild'` or `'jsdom'`, that is the reason and the fix is to declare it in
  # apps/mcp-app's devDependencies.
  #
  # NODE VERSION. Every job reads .nvmrc, which must match the Vercel project's
  # Node setting (24.x). Move both together, never one.
  #
  # WHY THE TYPE CHECK IS HERE AND NOT SKIPPED. It could not have been, until
  # this commit: `tsc --noEmit` exited 2 on a single pre-existing error,
  # src/main.tsx(5,8) TS2882, the side-effect import of ./styles.css. The cause
  # was `"types": []` in apps/mcp-app/tsconfig.json dropping Vite's ambient
  # `declare module '*.css'`; it is now `["vite/client"]`, which takes the error
  # count from one to zero and adds none. Fixed rather than excluded, because a
  # job that runs only half of what it should is the same blind spot in smaller
  # print. This does NOT type-check the harness — those are .mjs and outside
  # tsconfig's `include` — which is the honest remaining gap.
  card:
    name: Draft Card Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - name: Type check the card
        run: cd apps/mcp-app && npm run typecheck
      - name: Run card tests (five suites via harness/verify.mjs)
        run: cd apps/mcp-app && npm test

  # The edge function is a separate runtime with a separate test suite, and
  # until now nothing ran it. That mattered more than it looked: the MCP server
  # is where mail credentials are decrypted and where every mailbox operation
  # is actually performed, and its suite is the larger of the two (341 tests to
  # the web app's handful). Two of the security fixes prepared for the CASA
  # AL1 assessment — the signature-HTML allowlist and the SSRF host guard —
  # exist as deliberate Node/Deno twins whose whole contract is that the two
  # implementations stay identical. Each twin carries a drift check that fails
  # when they diverge, which is worth nothing if no CI job ever runs it.
  deno:
    name: Edge Function Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          # Match the version the functions are developed against; Deno's
          # minor releases have changed type-checking strictness before.
          deno-version: v2.x
      # WHY --node-modules-dir=none ON BOTH DENO STEPS. The repo root has a
      # package.json, which puts deno into "bring your own node_modules" mode.
      # A fresh checkout here runs no `npm install`, so there is no
      # node_modules, and resolution dies on `npm:openai@^4.52.5` — a
      # dependency of nothing we wrote, pulled in by the TYPES of
      # jsr:@supabase/functions-js (edge-runtime.d.ts:186). The flag turns byonm
      # off and sends npm specifiers to deno's own global cache, which is what
      # this job wants: it type-checks and tests the function, it does not need
      # a local install. Adding `openai` to package.json would be the wrong fix,
      # since nothing imports it.
      #
      # This was latent, not new. Until the `push` trigger above was added on
      # 2026-09-17 this job only ran on PRs, and the only PRs are dependabot's,
      # so the breakage showed up as "dependabot is red again" and was never
      # traced. Reproduced and fixed against a node_modules-free worktree, which
      # is exactly what the runner has: plain `deno check` fails there with the
      # message above, and with the flag it passes and the suite runs
      # 1288 passed / 0 failed / 2 ignored.
      - name: Type check the edge function
        run: deno check --node-modules-dir=none supabase/functions/mcp-server/index.ts
      - name: Run edge function tests
        # Withholding --allow-net is deliberate: a test that quietly starts
        # depending on the network fails here rather than becoming flaky in CI
        # later. host-guard.test.ts has two tests that resolve real hostnames,
        # and they are gated behind this env var precisely so that this job can
        # skip them; they run locally, where a developer can see a live DNS
        # failure for what it is. --allow-env is what lets the gate be read.
        #
        # --allow-run=git is the one exception, and it is scoped to that single
        # binary. card-build-notify.test.ts enumerates the repo with `git
        # ls-files` rather than with a hand-maintained list of top-level
        # directories, which was defeated in five straight rounds of review; the
        # alternative is re-implementing .gitignore semantics inside a test file.
        # Without the flag those three checks FAIL loudly rather than passing on
        # an empty file list, which is the whole point.
        env:
          HOST_GUARD_SKIP_NETWORK_TESTS: '1'
        run: deno test --node-modules-dir=none --allow-read --allow-env --allow-run=git supabase/functions/mcp-server/

  build:
    name: Build Check
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_APP_URL: https://mcpemails.com
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
      # Server-only secret read at module load by src/lib/stripe/client.ts.
      # A placeholder is enough for `next build` (no network calls at build time).
      STRIPE_SECRET_KEY: sk_test_placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - name: Build Next.js app
        run: cd apps/web && npm run build

  # Builds the database from supabase/migrations alone, then checks it.
  #
  # WHAT THIS CATCHES. (1) A migration that does not apply on a clean database.
  # (2) An access-rule (RLS) regression: supabase/tests is pgTAP, 75 checks that
  # impersonate two tenants and assert neither can read or write the other's
  # rows. Proven to bite on 2026-09-26 by disabling RLS on inboxes: four checks
  # failed, naming the leak ("Alice sees 3 inboxes, want 1"). (3) App code that
  # uses a table, column or function no migration creates: the app is
  # type-checked against types GENERATED from this database, not against the
  # committed database.types.ts. On its first run that found public.app_errors,
  # which production had and no migration created (fixed in
  # 20260926020000_app_errors_in_migrations.sql).
  #
  # WHY NOT A BYTE DIFF OF database.types.ts. `npm run gen:types` generates from
  # the linked project, this job from a local database, and the two generators
  # differ in formatting and metadata. A diff would be red on noise. Type-
  # checking against the generated file catches the direction that breaks
  # production (code ahead of the schema) with no false alarms.
  #
  # No secrets: config.toml reads no env(), and nothing here touches the linked
  # project.
  db:
    name: Database (migrations + RLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply every migration to a fresh database
        run: supabase db start
      - name: RLS and schema tests (pgTAP)
        run: supabase test db
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - name: Type-check the app against the migrated schema
        run: |
          supabase gen types typescript --local --schema public,graphql_public > apps/web/src/types/database.types.ts
          cd apps/web && npx tsc --noEmit

  # THE ONE CHECK PRODUCTION WAITS FOR. The Vercel project's Deployment Checks
  # require this job by name ("CI passed"): Vercel still builds every push to
  # main, but mcpemails.com is not pointed at the new build until this is green.
  # Before 2026-09-26 CI only reported after the fact; five red commits went
  # live on 2026-09-25/26.
  #
  # One aggregate job rather than listing every job in Vercel, so adding or
  # renaming a job here never needs a dashboard change. `if: always()` makes it
  # run, and fail, when a dependency fails or is cancelled; without it a failed
  # dependency would SKIP this job, and a skipped check is not a failed one.
  # Every new job must be added to `needs`. Emergency bypass: Force Promote on
  # the deployment in Vercel.
  ci-passed:
    name: CI passed
    if: always()
    needs: [audit, typecheck, test, card, deno, build, db]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
