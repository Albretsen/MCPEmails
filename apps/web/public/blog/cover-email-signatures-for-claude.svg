  </g>
  <text x="96" y="360" font-family="Inter, system-ui, sans-serif" font-size="68" font-weight="800" fill="#fff">Signed like you</text>
  <text x="96" y="442" font-family="Inter, system-ui, sans-serif" font-size="68" font-weight="800" fill="url(#accent)">would sign it</text>
  <text x="96" y="512" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="500" fill="#9fb3d1">Per-inbox signatures on every message Claude sends</text>
  <text x="96" y="566" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600" fill="#22b8cf">mcpemails.com/blog</text>
