<svg xmlns="http://www.w3.org/2000/svg" width="358" height="588" fill="none" viewBox="0 0 358 588"><title>What MCPEmails stores: encrypted credentials and scheduled or held sends in an EU database in Stockholm. Mail you read is fetched live and not stored.</title><style>@keyframes hcgo{0%{offset-distance:0;opacity:0}3%{opacity:1}88%{offset-distance:100%;opacity:1}94%,to{offset-distance:100%;opacity:0}}@font-face{font-family:hcg5;font-weight:500;src:url(data:font/woff2;base64,)format(&quot;woff2&quot;)}@font-face{font-family:hcg6;font-weight:600;src:url(data:font/woff2;base64,)format(&quot;woff2&quot;)}@font-face{font-family:hcm5;font-weight:500;src:url(data:font/woff2;base64,)format(&quot;woff2&quot;)}.e{font:500 12px hcm5,ui-monospace,&quot;SF Mono&quot;,Menlo,monospace;letter-spacing:.06em}.hl{font:600 18px hcg6,system-ui,-apple-system,&quot;Segoe UI&quot;,sans-serif;letter-spacing:-.015em}.h{font:600 14px hcg6,system-ui,-apple-system,&quot;Segoe UI&quot;,sans-serif;letter-spacing:-.01em}.b{font:500 13px hcg5,system-ui,-apple-system,&quot;Segoe UI&quot;,sans-serif}.s{font:500 12px hcg5,system-ui,-apple-system,&quot;Segoe UI&quot;,sans-serif}.dot{offset-path:path(&quot;M62.0 408.75H296.0&quot;);offset-rotate:0deg;animation:hcgo 4s cubic-bezier(.45,0,.55,1) .6s 3 both}@media (prefers-reduced-motion:reduce){.dot{animation:none;display:none}}</style><rect width="356.5" height="292" x=".75" y=".75" fill="#FAFBFD" stroke="#DEE1EB" stroke-width="1.5" rx="12"/><text x="16" y="28.75" fill="#626A7D" class="e">STORED, ENCRYPTED</text><text x="16" y="54.75" fill="#0B1020" class="hl">What MCPEmails keeps</text><rect width="334" height="60" x="12" y="76.75" fill="#FFF" stroke="#DEE1EB" stroke-width="1.5" rx="8"/><rect width="36" height="36" x="24" y="88.75" fill="#EEF2FF" rx="8"/><g stroke="#2547E5" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" transform="translate(30 94.75)"><rect width="14.5" height="10" x="4.75" y="10.25" rx="2.5"/><path d="M8.25 10.25v-2.5a3.75 3.75 0 0 1 7.5 0v2.5m-3.75 4v2"/></g><text x="72" y="102.75" fill="#0B1020" class="h">OAuth tokens and app passwords</text><text x="72" y="121.75" fill="#4B5167" class="s">AES-256-GCM encrypted at rest</text><rect width="334" height="60" x="12" y="146.75" fill="#FFF" stroke="#DEE1EB" stroke-width="1.5" rx="8"/><rect width="36" height="36" x="24" y="158.75" fill="#EEF2FF" rx="8"/><g stroke="#2547E5" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" transform="translate(30 164.75)"><path d="M11.25 15.25h-6.5a2 2 0 0 1-2-2v-6.5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2V11M3.5 6.25l6.25 4.5L16 6.25"/><circle cx="17.5" cy="16.5" r="4.25"/><path d="M17.5 14.75v1.75l1.25 1"/></g><text x="72" y="172.75" fill="#0B1020" class="h">Scheduled and held sends</text><text x="72" y="191.75" fill="#4B5167" class="s">Stored encrypted until they go out</text><rect width="334" height="60" x="12" y="216.75" fill="#FFF" stroke="#DEE1EB" stroke-width="1.5" rx="8"/><rect width="36" height="36" x="24" y="228.75" fill="#EEF2FF" rx="8"/><g stroke="#2547E5" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" transform="translate(30 234.75)"><path d="M12 17.5s-5.25-4.6-5.25-9.1a5.25 5.25 0 0 1 10.5 0c0 4.5-5.25 9.1-5.25 9.1"/><circle cx="12" cy="8.5" r="1.75"/><path d="M5.75 20.5h12.5"/></g><text x="72" y="242.75" fill="#0B1020" class="h">Where it lives</text><text x="72" y="261.75" fill="#4B5167" class="s">EU database in Stockholm, Sweden</text><rect width="356.5" height="278" x=".75" y="308.75" fill="#FFF" stroke="#C6CBDA" stroke-dasharray="6 6" stroke-width="1.5" rx="12"/><text x="16" y="336.75" fill="#626A7D" class="e">NOT STORED</text><text x="16" y="362.75" fill="#0B1020" class="hl">Your mail passes through</text><circle r="4.5" fill="#2547E5" stroke="#FFF" stroke-width="2" class="dot"/><rect width="92" height="44" x="16" y="386.75" fill="#FFF" stroke="#DEE1EB" stroke-width="1.5" rx="8"/><text x="62" y="413.75" fill="#0B1020" class="h" text-anchor="middle">Your inbox</text><rect width="92" height="44" x="133" y="386.75" fill="#2547E5" rx="8"/><text x="179" y="413.75" fill="#FFF" class="h" text-anchor="middle">MCPEmails</text><rect width="92" height="44" x="250" y="386.75" fill="#FFF" stroke="#DEE1EB" stroke-width="1.5" rx="8"/><text x="296" y="413.75" fill="#0B1020" class="h" text-anchor="middle">Your chat</text><path stroke="#2547E5" stroke-linecap="round" stroke-width="1.5" d="M112 408.75h17"/><path stroke="#2547E5" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="m123.5 404.25 5.5 4.5-5.5 4.5"/><path stroke="#2547E5" stroke-linecap="round" stroke-width="1.5" d="M229 408.75h17"/><path stroke="#2547E5" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="m240.5 404.25 5.5 4.5-5.5 4.5"/><text x="16" y="464.75" fill="#0B1020" class="h">Fetched live on each request</text><text x="16" y="486.75" fill="#4B5167" class="b">Bodies, subjects and attachments go to</text><text x="16" y="504.75" fill="#4B5167" class="b">your chat and are then discarded.</text><rect width="79" height="30" x="16" y="524.75" fill="#F5F6FA" rx="8"/><circle cx="30" cy="539.75" r="5" stroke="#9AA1B6" stroke-width="1.5"/><path stroke="#9AA1B6" stroke-width="1.5" d="m26.5 543.25 7-7"/><text x="42" y="544.25" fill="#2F3447" class="s">Bodies</text><rect width="90.6" height="30" x="103" y="524.75" fill="#F5F6FA" rx="8"/><circle cx="117" cy="539.75" r="5" stroke="#9AA1B6" stroke-width="1.5"/><path stroke="#9AA1B6" stroke-width="1.5" d="m113.5 543.25 7-7"/><text x="129" y="544.25" fill="#2F3447" class="s">Subjects</text><rect width="114.7" height="30" x="201.7" y="524.75" fill="#F5F6FA" rx="8"/><circle cx="215.7" cy="539.75" r="5" stroke="#9AA1B6" stroke-width="1.5"/><path stroke="#9AA1B6" stroke-width="1.5" d="m212.2 543.25 7-7"/><text x="227.7" y="544.25" fill="#2F3447" class="s">Attachments</text></svg>