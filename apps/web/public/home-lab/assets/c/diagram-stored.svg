<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" fill="none" viewBox="0 0 960 400"><title>What MCPEmails stores: encrypted credentials and scheduled or held sends in an EU database in Stockholm. Mail you read is fetched live and not stored.</title><style>@font-face{font-family:hcg5;font-weight:500;src:url(data:font/woff2;base64,)format(&quot;woff2&quot;)}@font-face{font-family:hcg6;font-weight:600;src:url(data:font/woff2;base64,)format(&quot;woff2&quot;)}@font-face{font-family:hcm5;font-weight:500;src:url(data:font/woff2;base64,)format(&quot;woff2&quot;)}.e{font:500 11px hcm5,ui-monospace,&quot;SF Mono&quot;,Menlo,monospace;letter-spacing:.08em}.h{font:600 16px hcg6,system-ui,-apple-system,&quot;Segoe UI&quot;,sans-serif;letter-spacing:-.01em}.hl{font:600 20px hcg6,system-ui,-apple-system,&quot;Segoe UI&quot;,sans-serif;letter-spacing:-.015em}.b{font:500 13px hcg5,system-ui,-apple-system,&quot;Segoe UI&quot;,sans-serif}.s{font:500 12px hcg5,system-ui,-apple-system,&quot;Segoe UI&quot;,sans-serif}</style><rect width="440" height="352" x="24" y="24" fill="#FAFBFD" stroke="#DEE1EB" stroke-width="1.5" rx="12"/><text x="48" y="58" fill="#626A7D" class="e">STORED, ENCRYPTED</text><text x="48" y="88" fill="#0B1020" class="hl">What MCPEmails keeps</text><rect width="392" height="64" x="48" y="116" fill="#FFF" stroke="#DEE1EB" stroke-width="1.5" rx="8"/><rect width="36" height="36" x="64" y="130" fill="#EEF2FF" rx="8"/><g stroke="#2547E5" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" transform="translate(70 136)"><rect width="14.5" height="10" x="4.75" y="10.25" rx="2.5"/><path d="M8.25 10.25v-2.5a3.75 3.75 0 0 1 7.5 0v2.5m-3.75 4v2"/></g><text x="116" y="144" fill="#0B1020" class="h">OAuth tokens and app passwords</text><text x="116" y="164" fill="#4B5167" class="b">AES-256-GCM encrypted at rest</text><rect width="392" height="64" x="48" y="196" fill="#FFF" stroke="#DEE1EB" stroke-width="1.5" rx="8"/><rect width="36" height="36" x="64" y="210" fill="#EEF2FF" rx="8"/><g stroke="#2547E5" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" transform="translate(70 216)"><path d="M11.25 15.25h-6.5a2 2 0 0 1-2-2v-6.5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2V11M3.5 6.25l6.25 4.5L16 6.25"/><circle cx="17.5" cy="16.5" r="4.25"/><path d="M17.5 14.75v1.75l1.25 1"/></g><text x="116" y="224" fill="#0B1020" class="h">Scheduled and held sends</text><text x="116" y="244" fill="#4B5167" class="b">Stored encrypted until they go out</text><rect width="392" height="64" x="48" y="276" fill="#FFF" stroke="#DEE1EB" stroke-width="1.5" rx="8"/><rect width="36" height="36" x="64" y="290" fill="#EEF2FF" rx="8"/><g stroke="#2547E5" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" transform="translate(70 296)"><path d="M12 17.5s-5.25-4.6-5.25-9.1a5.25 5.25 0 0 1 10.5 0c0 4.5-5.25 9.1-5.25 9.1"/><circle cx="12" cy="8.5" r="1.75"/><path d="M5.75 20.5h12.5"/></g><text x="116" y="304" fill="#0B1020" class="h">Where it lives</text><text x="116" y="324" fill="#4B5167" class="b">EU database in Stockholm, Sweden</text><rect width="440" height="352" x="496" y="24" fill="#FFF" stroke="#C6CBDA" stroke-dasharray="6 6" stroke-width="1.5" rx="12"/><text x="520" y="58" fill="#626A7D" class="e">NOT STORED</text><text x="520" y="88" fill="#0B1020" class="hl">Your mail passes through</text><rect width="112" height="52" x="520" y="134" fill="#FFF" stroke="#DEE1EB" stroke-width="1.5" rx="8"/><text x="576" y="165" fill="#0B1020" class="h" text-anchor="middle">Your inbox</text><rect width="112" height="52" x="660" y="134" fill="#2547E5" rx="8"/><text x="716" y="165" fill="#FFF" class="h" text-anchor="middle">MCPEmails</text><rect width="112" height="52" x="800" y="134" fill="#FFF" stroke="#DEE1EB" stroke-width="1.5" rx="8"/><text x="856" y="165" fill="#0B1020" class="h" text-anchor="middle">Your chat</text><path stroke="#2547E5" stroke-linecap="round" stroke-width="1.5" d="M638 160h16"/><path stroke="#2547E5" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="m648.5 155.5 5.5 4.5-5.5 4.5"/><path stroke="#2547E5" stroke-linecap="round" stroke-width="1.5" d="M778 160h16"/><path stroke="#2547E5" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="m788.5 155.5 5.5 4.5-5.5 4.5"/><text x="520" y="222" fill="#0B1020" class="h">Fetched live on each request</text><text x="520" y="244" fill="#4B5167" class="b">Bodies, subjects and attachments go to</text><text x="520" y="262" fill="#4B5167" class="b">your chat and are then discarded.</text><rect width="79" height="30" x="520" y="284" fill="#F5F6FA" rx="8"/><circle cx="534" cy="299" r="5" stroke="#9AA1B6" stroke-width="1.5"/><path stroke="#9AA1B6" stroke-width="1.5" d="m530.5 302.5 7-7"/><text x="546" y="303.5" fill="#2F3447" class="s">Bodies</text><rect width="90.6" height="30" x="607.04" y="284" fill="#F5F6FA" rx="8"/><circle cx="621.04" cy="299" r="5" stroke="#9AA1B6" stroke-width="1.5"/><path stroke="#9AA1B6" stroke-width="1.5" d="m617.54 302.5 7-7"/><text x="633.04" y="303.5" fill="#2F3447" class="s">Subjects</text><rect width="114.7" height="30" x="705.65" y="284" fill="#F5F6FA" rx="8"/><circle cx="719.65" cy="299" r="5" stroke="#9AA1B6" stroke-width="1.5"/><path stroke="#9AA1B6" stroke-width="1.5" d="m716.15 302.5 7-7"/><text x="731.65" y="303.5" fill="#2F3447" class="s">Attachments</text></svg>