# Minimal gateway: exposes PostgREST under the /rest/v1/ path prefix that
# supabase-js expects, so the MCP server can talk to it unchanged with
# SUPABASE_URL=http://gateway. Nothing else is routed.
server {
    listen 80;
    server_name _;
    server_tokens off;

    # supabase-js calls:  /rest/v1/<table>  and  /rest/v1/rpc/<fn>
    # PostgREST serves:    /<table>          and  /rpc/<fn>
    #
    # Resolve the upstream at request time (Docker's embedded DNS, 127.0.0.11)
    # via a variable in proxy_pass, so nginx starts even if PostgREST is briefly
    # down/restarting instead of hard-failing with "host not found in upstream".
    location ~ ^/rest/v1/(?<pgrst_path>.*)$ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $pgrst_upstream postgrest;
        proxy_pass http://$pgrst_upstream:3000/$pgrst_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
